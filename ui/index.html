<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f5f6f8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>闲聊</title>
<link rel="stylesheet" href="ui/app.css?v=15" />
<link rel="manifest" href="ui/manifest.webmanifest" />
<link rel="icon" href="ui/icon-192.png" />
<link rel="apple-touch-icon" href="ui/icon-192.png" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
<div id="drawer-scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="drawer-title">dsh chat lite</span>
    <button id="refresh" class="icon-btn" type="button" aria-label="刷新">⟳</button>
  </div>
  <button id="new-chat" class="new-chat" type="button">开启新对话</button>
  <div class="search-box">
    <svg viewBox="0 0 24 24" class="icon"><path d="M10 4a6 6 0 104.24 10.24l4.26 4.26 1.42-1.42-4.26-4.26A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
    <input id="search" type="search" placeholder="搜索对话内容" autocomplete="off" />
  </div>
  <div id="search-tabs" class="search-tabs" hidden>
    <button type="button" data-scope="title" class="active">标题</button>
    <button type="button" data-scope="full">全文</button>
  </div>
  <div id="list" class="list"></div>
  <button id="settings-entry" class="drawer-foot" type="button">
    <svg viewBox="0 0 24 24" class="icon"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4a7 7 0 01-.1 1.2l2 1.6-2 3.4-2.4-1a7 7 0 01-2 1.2l-.3 2.6h-4l-.3-2.6a7 7 0 01-2-1.2l-2.4 1-2-3.4 2-1.6A7 7 0 013 12c0-.4 0-.8.1-1.2l-2-1.6 2-3.4 2.4 1a7 7 0 012-1.2L7.8 3h4l.3 2.6a7 7 0 012 1.2l2.4-1 2 3.4-2 1.6c.1.4.1.8.1 1.2z"/></svg>
    设置
    <span id="build" class="build"></span>
  </button>
</aside>

<main id="main" class="main">
  <header class="topbar">
    <button id="open-drawer" class="icon-btn" type="button" aria-label="会话列表">
      <svg viewBox="0 0 24 24" class="icon"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div id="title" class="title">闲聊</div>
    <span id="conn" class="conn" title="连接状态"></span>
    <button class="icon-btn muted" type="button" disabled aria-label="朗读">
      <svg viewBox="0 0 24 24" class="icon"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg>
    </button>
    <button id="new-chat-top" class="icon-btn" type="button" aria-label="新对话">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section id="messages" class="messages"></section>

  <div id="empty" class="empty" hidden>
    <div class="empty-logo">🐳</div>
    <div class="empty-text">今天有什么可以帮到你？</div>
  </div>

  <footer class="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="输入消息" enterkeyhint="send"></textarea>
      <div class="composer-tools">
        <button id="effort-chip" class="chip" type="button">思考强度:高</button>
        <button id="web-chip" class="chip chip-on" type="button">🌐 开</button>
        <span class="grow"></span>
        <button id="attach" class="icon-btn" type="button" aria-label="附件">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button id="send" class="send-btn" type="button" aria-label="发送">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div id="pending" class="pending" hidden></div>
    <input id="file-camera" type="file" accept="image/*" capture="environment" hidden />
    <input id="file-album" type="file" accept="image/*" hidden />
    <input id="file-doc" type="file" multiple accept=".txt,.md,.markdown,.json,.jsonl,.csv,.tsv,.log,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.7z,.epub,.html,.xml,.yml,.yaml,.ini,.toml,text/plain,text/markdown,application/json,application/pdf,application/zip" hidden />
    <div id="attach-sheet" class="sheet" hidden>
      <button class="sheet-item" type="button" data-kind="camera">
        <svg viewBox="0 0 24 24" class="icon"><path d="M9 4l-1.5 2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-2.5L15 4H9zm3 5a4 4 0 110 8 4 4 0 010-8z"/></svg>
        拍照
      </button>
      <button class="sheet-item" type="button" data-kind="album">
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 5h16v14H4zM6 7v10h12V7H6zm2 8l2.5-3 2 2.2L15 11l3 4H8z"/></svg>
        相册
      </button>
      <button class="sheet-item" type="button" data-kind="file">
        <svg viewBox="0 0 24 24" class="icon"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>
        文件
      </button>
    </div>
  </footer>
</main>

<div id="settings-panel" class="sheet-panel" hidden>
  <div class="sheet-panel-head">
    <span>设置</span>
    <button id="settings-close" type="button" aria-label="关闭">×</button>
  </div>
  <div class="sheet-panel-body">
    <div class="setting-row">
      <div class="setting-label">此设备</div>
      <div id="setting-device" class="setting-value">—</div>
    </div>
    <div class="setting-row">
      <div class="setting-label">已配对设备</div>
      <div id="setting-devices" class="setting-value">—</div>
    </div>
    <div class="setting-row column">
      <div class="setting-label">访问地址</div>
      <div id="setting-urls" class="setting-value mono"></div>
    </div>
    <div class="setting-row">
      <div class="setting-label">字体</div>
      <div class="setting-value">
        <button id="font-minus2" type="button" class="mini">A−</button>
        <span id="font-value2" class="font-value">100%</span>
        <button id="font-plus2" type="button" class="mini">A+</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">配对</div>
      <div class="setting-value">
        <button id="settings-pair" type="button" class="mini">重新配对</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">设备清理</div>
      <div class="setting-value">
        <button id="settings-prune" type="button" class="mini">清理其它设备</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">缓存</div>
      <div class="setting-value">
        <button id="settings-clear" type="button" class="mini">清缓存并刷新</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label">版本</div>
      <div id="setting-build" class="setting-value mono">—</div>
    </div>
  </div>
</div>

<div id="effort-pop" class="pop" hidden>
  <button type="button" data-effort="max">思考强度:极</button>
  <button type="button" data-effort="high">思考强度:高</button>
  <button type="button" data-effort="low">思考强度:低</button>
  <button type="button" data-effort="off">思考强度:关</button>
</div>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-card">
    <div id="dialog-title" class="dialog-title"></div>
    <textarea id="dialog-input" rows="2" hidden></textarea>
    <div id="dialog-text" class="dialog-text" hidden></div>
    <div class="dialog-actions">
      <button id="dialog-cancel" type="button" class="dialog-btn">取消</button>
      <button id="dialog-ok" type="button" class="dialog-btn primary">确定</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="offline-banner" class="offline-banner" hidden>离线模式 · 显示最近 3 天的缓存</div>

<div id="pairing" class="pairing" hidden>
  <div class="pairing-card">
    <div class="pairing-logo">🐳</div>
    <div class="pairing-title">连接这台设备</div>
    <div class="pairing-note">
      在电脑上打开「设置 → 闲聊区 → 手机访问」，复制配对链接，粘贴到下面。
      只需要做一次，之后长期有效。
    </div>
    <textarea id="pairing-input" rows="3" placeholder="粘贴配对链接或配对码" autocomplete="off"></textarea>
    <button id="pairing-submit" class="pairing-btn" type="button">连接</button>
    <div id="pairing-msg" class="pairing-msg"></div>
  </div>
</div>
<script src="ui/app.js?v=15"></script>
</body>
</html>
