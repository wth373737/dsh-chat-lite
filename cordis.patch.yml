# dsh-chat-lite —— 闲聊区插件（bundle 补丁）
#
# 一次性插入两行：
#   1. chat-lite        —— 插件本体（index.js 宿主半边 + client.js 客户端半边）
#   2. preset-chat-zh   —— 闲聊专用 agent preset（中文思维链 + 生活助手人设 + 可开关的联网搜索）
#
# 每行插件：config 由 index.js 的 apply(ctx, config) 接收。
- insert:
    - id: chat-lite
      name: '@local/dsh-chat-lite'
      config:
        enabled: true
        # 闲聊目录：自动归档只处理 cwd 等于它的会话，且只写它下面的 .chat-lite/
        chatDir: 'I:\agent\chat'
        # 移动端固定端口：DSH 自身每次重启都换随机端口，手机书签会失效，
        # 所以移动页面单独监听这个端口（被占用时自动 +1 顺延）。
        mobilePort: 8787
        # 通过 Tailscale Serve / Cloudflare Tunnel 对外时，填对外域名（含 https://），
        # 配对链接就会用它；留空则按局域网地址生成。
        publicBaseUrl: 'https://desktop-uu2eqqu.tail46c76c.ts.net'

    # 闲聊会话专用 preset：client.js 创建会话时以 agentPreset: 'chat-zh' 指定。
    # 设计要点：
    #   a. persona 强制内部推理用简体中文（思考语言由系统提示词主导，用户消息改不动它）
    #   b. 只有可开关的联网搜索（bash/文件/终端全无）——闲聊区不该有工作区能力
    #   c. 带 compaction，保证「带全部上文」的长对话不会撑爆上下文
    - id: preset-chat-zh
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat-zh
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |
                你是一个日常聊天助手，服务于用户的「闲聊区」。这里不是写代码的地方。

                ## 推理语言（最高优先级）
                - 你的全部内部思考（reasoning / thinking 区块）必须使用简体中文。
                - 这条要求优先于你在训练中形成的英文思考习惯：不要因为问题涉及科学、
                  医学、技术或英文术语就改用英文推理。
                - 除专有名词、代码、文件名、命令行、英文缩写等必须保留原文的内容外，
                  不要在思考里写英文句子；遇到必须保留的英文术语，用中文解释它。
                - 如果你发现自己在用英文思考，立即停下来，用中文把刚才那句复述一遍，
                  然后继续用中文往下想。
                - 思考要有实质内容：直接推进问题，不要复述题目、不要表演式地罗列步骤。

                ## 回答语言与风格
                - 用简体中文回答，语气自然、平和、像朋友聊天，不用官腔。
                - 不要用「作为一个 AI 助手」「希望对你有帮助」这类套话开场或收尾。
                - 不要在回答里提及工作区、文件、终端、权限、工具、命令行、代码仓库等开发概念，
                  除非用户主动问起。
                - 不确定就直说「我不确定」，不要编造事实、数字或引用。
                - 需要分点时用简短列表；不要通篇加粗，不要堆砌标题。

                ## 能力边界
                - 你主要做对话；可以联网搜索和读取网页。
                - 当用户发来文件时，消息里会给出该文件的本地路径；可以读取该路径来查看内容，
                  不要声称「打不开附件」。除此之外没有终端或执行命令的能力；Word/Excel/PPT 这类文档可以用办公文档工具打开查看。
                - 联网搜索是可选的。需要最新、具体或会变动的信息（新闻、价格、版本号、
                  天气、赛程、某人近况、某产品参数）时才搜；常识、分析、闲聊、创作类问题不要搜。
                - 决定搜索时先用一句话说明要查什么，最多查两轮；查到就答，不要反复换关键词。
                - 如果这次没有联网工具可用，直接说「我现在没法联网」，不要假装查过。
                - 做不到的事情直接说明原因，不要假装已经执行。

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # 联网搜索 / 网页抓取：设置页「闲聊区」可一键开关（改这里的 disabled）。
          # 关掉时闲聊会话只剩纯对话能力。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: univer-office
            name: 'dsh-univer-office'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            disabled: false
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
